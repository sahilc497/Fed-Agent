[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-agentic-mesh"
version = "1.0.0"
description = "Federated Agentic Mesh — Secure Multi-Agent Enterprise AI Backend"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Mesh Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "pydantic>=2.7.0,<2.11.0",
    "pydantic-settings>=2.2.0,<2.9.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "alembic>=1.13.0,<1.15.0",
    "psycopg2-binary>=2.9.9,<2.10.0",
    "httpx>=0.27.0,<0.29.0",
    "requests>=2.31.0",
    "numpy>=1.24.0,<2.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<8.4.0",
    "pytest-asyncio>=0.23.0,<0.25.0"
]
