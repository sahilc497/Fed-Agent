[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-agentic-mesh"
version = "1.0.0"
description = "Federated Agentic Mesh — Secure Multi-Agent Enterprise AI Backend"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Mesh Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "pydantic>=2.7.0,<2.11.0",
    "pydantic-settings>=2.2.0,<2.9.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "httpx>=0.27.0,<0.29.0",
    "requests>=2.31.0",
    "numpy>=1.24.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "joblib>=1.3.0,<2.0.0",
    "sentence-transformers>=2.2.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<8.4.0",
    "pytest-asyncio>=0.23.0,<0.25.0"
]
